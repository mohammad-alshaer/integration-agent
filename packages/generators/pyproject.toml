[project]
name = "integration-agent-generators"
version = "0.1.0"
description = "Per-pattern transformation generators (SQL + dbt tests) for Integration-Agent"
requires-python = ">=3.11,<3.13"
dependencies = [
    "integration-agent-schemas",
    "pydantic>=2.9",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
