[project]
name = "integration-agent-evals"
version = "0.1.0"
description = "Golden-set evaluation + scorer for Integration-Agent mappings"
requires-python = ">=3.11,<3.13"
dependencies = [
    "integration-agent-schemas",
    "integration-agent-agents",
    "integration-agent-validator",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "typer>=0.12",
    "truststore>=0.10",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
