[project]
name = "integration-agent-agents"
version = "0.1.0"
description = "LangGraph graph + specialists + LLM client for Integration-Agent"
requires-python = ">=3.11,<3.13"
dependencies = [
    "integration-agent-schemas",
    "integration-agent-generators",
    "integration-agent-validator",
    "pydantic>=2.9",
    "diskcache>=5.6",
    "google-genai>=1.0",
    "anthropic>=0.40",
    "python-dotenv>=1.0",
    "duckdb>=1.1",
    "voyageai>=0.3",
    "langgraph>=0.2,<0.3",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
