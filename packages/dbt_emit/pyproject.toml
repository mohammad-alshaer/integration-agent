[project]
name = "integration-agent-dbt-emit"
version = "0.1.0"
description = "Emit dbt project (project.yml, profiles.yml, stg_*.sql, schema.yml) from a list of MappingSpecs"
requires-python = ">=3.11,<3.13"
dependencies = [
    "integration-agent-schemas",
    "pydantic>=2.9",
    "pyyaml>=6.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
