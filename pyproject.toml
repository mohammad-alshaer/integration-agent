[project]
name = "integration-agent"
version = "0.1.0"
description = "Multi-agent AI system for automated schema mapping and data integration (OLTP -> DW)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "Mohammad Falshaer" }]
dependencies = [
    "pyodbc>=5.0",
    "duckdb>=1.1",
    "pyarrow>=18.0",
    "diskcache>=5.6",
    "google-genai>=1.0",
    "anthropic>=0.40",
    "langfuse>=2.50",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "truststore>=0.10",
    "typer>=0.12",
    "pandas>=2.2",
    "voyageai>=0.3",
    "langgraph>=0.2,<0.3",
    "dbt-duckdb>=1.8",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "mypy>=1.13",
    "pre-commit>=4.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP", "SIM"]
# B008: typer's idiomatic typer.Option(...) defaults trip this; safe for immutable sentinels.
# E501: line-too-long handled by ruff format.
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-first-party = [
    "agents",
    "schemas",
    "generators",
    "validator",
    "dbt_emit",
    "evals",
    "observability",
    "sqlserver",
    "worker",
    "api",
]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["packages", "apps"]
